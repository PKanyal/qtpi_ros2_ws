# ROS 2 Humble desktop for the buggy (RViz), reachable over RDP.
#
#   ./start.sh        build (first time) and start in the background
#   Windows App  ->   Add PC: localhost:3390   user: ros   password: ros
#   docker compose down    stop it

services:
  rviz:
    build: .
    image: buggy-rviz:humble
    container_name: buggy-rviz
    environment:
      - PI_ADDR=${PI_ADDR:?set PI_ADDR in .env}
    extra_hosts:
      # Docker Desktop provides this already; needed on Linux hosts
      - "host.docker.internal:host-gateway"
    ports:
      # localhost only: nothing else on the network can reach the desktop
      - "127.0.0.1:3390:3389"
    volumes:
      # RViz layout; "File > Save Config" in RViz saves back to this file
      - ./buggy.rviz:/home/ros/buggy.rviz
    shm_size: "1gb"
    restart: unless-stopped
